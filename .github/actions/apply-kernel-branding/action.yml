name: 'Apply Kernel Branding & Timestamp'
description: 'Apply kernel branding to kernel version string'
inputs:
  variant:
    description: 'Variant of kernel to apply branding to'
    required: true
  kernel_version:
    description: 'Kernel version (e.g., 6.1)'
    required: true
  android_version:
    description: 'Android version (e.g., android14)'
    required: true
  version:
    description: 'Combined version (e.g., android14-6.1)'
    required: true
  sublevel:
    description: 'Sublevel of kernel version (e.g., 1)'
    required: true
  brand_name:
    description: 'Branding text appended to the version (e.g., Wild). Empty = stock version string.'
    required: false
    default: Wild
  keep_kmi:
    description: 'Keep stock KMI generation suffix (e.g., -8) and append brand after it. Off = legacy hardcoded replace.'
    required: false
    default: 'false'

runs:
  using: "composite"
  steps:
    - name: Apply Kernel Name Branding
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        VERSION="${{ inputs.version }}"
        ANDROID_PART=$(echo "$VERSION" | cut -d- -f1)
        KERNEL_PART=$(echo "$VERSION" | cut -d- -f2)
        BRAND="${{ inputs.brand_name }}"
        KEEP_KMI="${{ inputs.keep_kmi }}"

        if [ -z "$BRAND" ]; then
          echo "brand_name is empty, keeping stock kernel version string"
          exit 0
        fi

        KMI=""
        if [ "$KEEP_KMI" = "true" ]; then
          # 1) the documented location, 2) anywhere in the tree, 3) known generation
          KMI=$(grep -h "^KMI_GENERATION" build.config.common build.config.constants 2>/dev/null | head -n 1 | cut -d= -f2 | tr -d '"'"'"' ' || true)
          if [ -z "$KMI" ]; then
            KMI=$(grep -rh --include='build.config*' "^KMI_GENERATION" . 2>/dev/null | head -n 1 | cut -d= -f2 | tr -d '"'"'"' ' || true)
          fi
          if [ -z "$KMI" ]; then
            case "${{ inputs.version }}" in
              android12-5.10) KMI=9 ;;
              android14-6.1) KMI=11 ;;
            esac
            echo "NOTE: KMI_GENERATION not found in tree; using KMI=$KMI for ${{ inputs.version }}"
            if [ -z "$KMI" ]; then echo "WARN: KMI unknown; falling back to legacy branding without KMI suffix"; fi
          else
            echo "KMI_GENERATION resolved to: $KMI"
          fi
        fi

        if [ "$KEEP_KMI" = "true" ] && [ -n "$KMI" ]; then
          # This tree's scripts/setlocalversion APPENDS its output to the version, so
          # writing the whole "6.1.138-android14-11-BRAND" produced
          # "6.1.1386.1.138-android14-11-BRAND" (observed on run 37101971507).
          # Follow the same split the legacy branch uses per kernel family:
          #   scm_version variant / 6.6+ trees replace the suffix -> full string
          #   android14-6.1 and older append                       -> "-android14-11-BRAND"
          if grep -q 'scm_version}"' scripts/setlocalversion; then
            BRAND_STRING="$KERNEL_PART.${{ inputs.sublevel }}-$ANDROID_PART-$KMI-$BRAND"
          elif [[ "${{ inputs.version }}" == "android15-6.6" || "${{ inputs.version }}" == "android16-6.12" || "${{ inputs.version }}" == "android17-6.18" ]]; then
            BRAND_STRING="$KERNEL_PART.${{ inputs.sublevel }}-$ANDROID_PART-$KMI-$BRAND"
          else
            BRAND_STRING="-$ANDROID_PART-$KMI-$BRAND"
          fi
          echo "branding suffix: $BRAND_STRING"
          sed -i '$d' scripts/setlocalversion && echo "echo \"$BRAND_STRING\"" >> scripts/setlocalversion
        else
          if [[ ${{ inputs.version }} == "android15-6.6" || ${{ inputs.version }} == "android16-6.12" || ${{ inputs.version }} == "android17-6.18" ]]; then
            KERNEL_STRING="$KERNEL_PART.${{ inputs.sublevel }}-$ANDROID_PART"
            sed -i '$d' scripts/setlocalversion && echo "echo \"$KERNEL_STRING-$BRAND\"" >> scripts/setlocalversion
          else
            sed -i '$d' scripts/setlocalversion && echo "echo \"-$ANDROID_PART-$BRAND\"" >> scripts/setlocalversion
          fi
        fi
        chmod +x scripts/setlocalversion
        tail -n 1 scripts/setlocalversion
