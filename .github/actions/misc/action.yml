name: 'Setup Misc Configs'
description: 'Set up kernel configuration fragment with miscellaneous options'
inputs:
  version:
    description: 'Kernel config version (e.g., android14-6.12)'
    required: true
  kernel_version:
    description: 'Kernel version (e.g., 6.1)'
    required: true
  android_version:
    description: 'Android version (e.g., android14)'
    required: true
  sublevel:
    description: 'Sublevel of kernel version (e.g., 1)'
    required: true
  variant:
    description: 'Build variant (Normal, Bypass, Wild, boot-time)'
    required: true

runs:
  using: "composite"
  steps:
    - name: Enable Kernel Configs
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y

          # ---- Pandora-parity fragment (from IKCONFIG diff vs stock/Pandora) ----
          # ROUND 1: only options that are plain bools in GKI - no built-in<->module
          # flips. Flipping those makes Kleaf fail ("Unable to find <x>.ko"), because
          # common/BUILD.bazel declares the module outputs. Round 2 will handle zram
          # (built-in + zstd) together with the matching module_outs edit.
          CONFIG_CPU_IDLE_THERMAL=y
          # networking: keep the choice menu, BBR available, CUBIC default (as Pandora)
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_DEFAULT_CUBIC=y
          # CONFIG_DEFAULT_BBR is not set
          CONFIG_UNIX_SCM=y
          # RCU / block layer
          CONFIG_RCU_NOCB_CPU_DEFAULT_ALL=y
          CONFIG_TASKS_TRACE_RCU_READ_MB=y
          # CONFIG_RCU_LAZY_DEFAULT_OFF is not set
          CONFIG_BLK_MQ_USE_LOCAL_THREAD=y
          # ftrace/kprobe capability
          CONFIG_OPTPROBES=y
          CONFIG_HAVE_KPROBES_ON_FTRACE=y
          # DEFERRED to round 2 (module flips, need BUILD.bazel module_outs edits):
          #   CONFIG_ZRAM=y / ZSMALLOC=y / ZRAM_DEF_COMP_ZSTD=y / ZRAM_MEMORY_TRACKING
          #   CONFIG_CRYPTO_LZ4P / CRYPTO_ZSTDP
          #   CONFIG_IP_SET* / NETFILTER_XT_SET / IP6_NF_TARGET_* / XT_MATCH_ADDRTYPE
          #   CONFIG_BPF_STREAM_PARSER / STREAM_PARSER
          