name: 'Setup Misc Configs'
description: 'Set up kernel configuration fragment with miscellaneous options'
inputs:
  version:
    description: 'Kernel config version (e.g., android14-6.12)'
    required: true
  kernel_version:
    description: 'Kernel version (e.g., 6.1)'
    required: true
  android_version:
    description: 'Android version (e.g., android14)'
    required: true
  sublevel:
    description: 'Sublevel of kernel version (e.g., 1)'
    required: true
  variant:
    description: 'Build variant (Normal, Bypass, Wild, boot-time)'
    required: true

runs:
  using: "composite"
  steps:
    - name: Enable Kernel Configs
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y

          # ---- Pandora-parity fragment (from IKCONFIG diff vs stock/Pandora) ----
          # stock had these and our vanilla-GKI build was missing them
          CONFIG_CPU_IDLE_THERMAL=y
          # zram built-in with zstd, like Pandora (stock ships zram=m with lzo-rle)
          CONFIG_ZRAM=y
          CONFIG_ZSMALLOC=y
          CONFIG_ZRAM_DEF_COMP_ZSTD=y
          # CONFIG_ZRAM_DEF_COMP_LZORLE is not set
          CONFIG_ZRAM_MEMORY_TRACKING=y
          CONFIG_CRYPTO_LZ4P=m
          CONFIG_CRYPTO_ZSTDP=m
          # networking extras Pandora enables
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_DEFAULT_CUBIC=y
          # CONFIG_DEFAULT_BBR is not set
          CONFIG_IP_SET=y
          CONFIG_IP_SET_MAX=256
          CONFIG_NETFILTER_XT_SET=y
          CONFIG_IP6_NF_NAT=y
          CONFIG_IP6_NF_TARGET_MASQUERADE=y
          CONFIG_IP6_NF_TARGET_NPT=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_BPF_STREAM_PARSER=y
          CONFIG_STREAM_PARSER=y
          CONFIG_UNIX_SCM=y
          # RCU / block layer
          CONFIG_RCU_NOCB_CPU_DEFAULT_ALL=y
          CONFIG_TASKS_TRACE_RCU_READ_MB=y
          # CONFIG_RCU_LAZY_DEFAULT_OFF is not set
          CONFIG_BLK_MQ_USE_LOCAL_THREAD=y
          # ftrace/kprobe capability
          CONFIG_OPTPROBES=y
          CONFIG_HAVE_KPROBES_ON_FTRACE=y
          